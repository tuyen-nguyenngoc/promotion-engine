services:
  db:
    image: postgres:16
    container_name: promotion-db
    environment:
      POSTGRES_DB: promotiondb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d promotiondb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: promotion-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/promotiondb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy
